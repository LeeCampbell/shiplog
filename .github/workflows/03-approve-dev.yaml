name: 03-Approve dev
run-name: Approve ${{ github.event.client_payload.version }} for dev
on:
  repository_dispatch:
    types: [artifact-published]

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          event-type: release-approved
          client-payload: |-
            {
              "environment": "dev",
              "version": "${{ github.event.client_payload.version }}",
              "approver": "auto",
              "causation": ${{ toJson(github.event.client_payload) }}
            }
