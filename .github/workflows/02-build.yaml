name: 02-Build
on:
  push:
    branches: [main]

concurrency:
  group: build

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          target: ${{ matrix.target }}
          push: true
          build-args: VERSION=${{ needs.version.outputs.tag }}
          tags: ${{ steps.name.outputs.repo }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  announce:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          event-type: artifact-published
          client-payload: |-
            {
              "version": "${{ needs.version.outputs.tag }}",
              "sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}"
            }
